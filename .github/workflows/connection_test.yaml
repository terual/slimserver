name: Lyrion Connection Test

on: [push, pull_request, workflow_dispatch]

jobs:
  integration-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: '5.38'
          install-modules: |
            JSON::RPC::Client
            Net::CLI::Interact

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y squeezelite libasound2

      - name: Install Lyrion Dependencies
        run: |
          # Installeer de perl deps voor Lyrion zelf
          cpanm --installdeps .

      - name: Start Lyrion Music Server (Background)
        run: |
          # Start server met een tijdelijke prefs file
          perl slimserver.pl --daemon --prefssuffix _test --httpport 9000 --cliport 9090 &
          # Wacht tot de server up is
          until curl -s http://localhost:9000; do sleep 2; done

      - name: Start Squeezelite Player
        run: |
          # Start een virtuele speler en verbind met de lokale server
          # -n: naam, -m: fake mac adres voor herkenning, -s: server ip
          squeezelite -n "TestPlayer" -m 00:11:22:33:44:55 -s localhost &
          sleep 5

      - name: Verify Player Discovery via JSON-RPC
        run: |
          # Controleer of de server de speler ziet
          curl -X POST -H "Content-Type: application/json" \
            -d '{"id":1,"method":"slim.request","params":["",["players",0,10]]}' \
            http://localhost:9000/jsonrpc.js | grep "TestPlayer"

      - name: Functional Test: Play & Status
        run: |
          # 1. Geef een play commando via de API
          curl -X POST -H "Content-Type: application/json" \
            -d '{"id":1,"method":"slim.request","params":["00:11:22:33:44:55",["play"]]}' \
            http://localhost:9000/jsonrpc.js
          
          # 2. Verifieer status
          RESPONSE=$(curl -s -X POST -H "Content-Type: application/json" \
            -d '{"id":1,"method":"slim.request","params":["00:11:22:33:44:55",["status"]]}' \
            http://localhost:9000/jsonrpc.js)
          
          echo "Server Response: $RESPONSE"
          # Check of 'mode' op 'play' staat
          echo $RESPONSE | grep '"mode":"play"'

      - name: Linting (Perl Critic)
        if: always()
        run: |
          cpanm Perl::Critic
          perlcritic Slim/
