name: Lyrion Connection Test

on: [push, pull_request, workflow_dispatch]

jobs:
  integration-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v6

      - name: Install dependencies
        if: ${{ env.ACT }}
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: squeezelite libio-socket-ssl-perl libnet-ssleay-perl netcat-traditional
          version: 1

      - name: Install dependencies (ACT fallback)
        if: ${{ !env.ACT }}
        run: |
          sudo apt-get update
          sudo apt-get install -y squeezelite libio-socket-ssl-perl libnet-ssleay-perl netcat-traditional

      - name: Start Lyrion Music Server (Background)
        run: |
          # Start server met een tijdelijke prefs file
          perl slimserver.pl --daemon --prefssuffix _test --httpport 9000 --cliport 9090 &
          # Wacht tot de server up is
          until curl -s -o /dev/null http://localhost:9000; do 
            echo "Waiting for LMS to start..."
            sleep 2
          done
          
      - name: Start Squeezelite (Headless/Virtual Audio)
        run: |
          # Gebruik '-o -' om audio naar stdout te sturen (voorkomt ALSA device errors)
          # Gebruik '-z' om als daemon op de achtergrond te draaien
          squeezelite -n "TestPlayer" -m 00:11:22:33:44:55 -s localhost -o null -z
          sleep 5

      - name: Verify Player Discovery via JSON-RPC
        run: |
          # Controleer of de server de speler ziet
          curl -X POST -H "Content-Type: application/json" \
            -d '{"id":1,"method":"slim.request","params":["",["players",0,10]]}' \
            http://localhost:9000/jsonrpc.js | grep "TestPlayer"

      - name: Verify play stream and status
        run: |
          PLAYER_MAC="00:11:22:33:44:55"
          # 1. Voeg een test-stream toe aan de playlist en start met spelen
          # We gebruiken een varkens-radio of een stabiele stream URL
          STREAM_URL="https://somafm.com/live130.pls"
          
          curl -X POST -H "Content-Type: application/json" \
            -d "{\"id\":1,\"method\":\"slim.request\",\"params\":[\"$PLAYER_MAC\",[\"playlist\",\"play\",\"$STREAM_URL\"]]}" \
            http://localhost:9000/jsonrpc.js
          
          # Geef de server even de tijd om de stream te bufferen
          sleep 5
          
          # 2. Verifieer status
          RESPONSE=$(curl -s -X POST -H "Content-Type: application/json" \
            -d "{\"id\":1,\"method\":\"slim.request\",\"params\":[\"$PLAYER_MAC\",[\"status\"]]}" \
            http://localhost:9000/jsonrpc.js)
          
          echo "Server Response: $RESPONSE"
          
          # Check of de 'mode' op 'play' staat
          if echo "$RESPONSE" | grep -q '"mode":"play"'; then
            echo "Succes: Speler is aan het streamen!"
          else
            echo "Fout: Speler staat niet in play-modus."
            exit 1
          fi
