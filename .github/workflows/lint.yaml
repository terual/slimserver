name: 'Lint perl'
on:
  workflow_dispatch:
  pull_request:

permissions:
  checks: write
  contents: read    # Best practice: explicit add 'read' when adding other rights

jobs:
  linux:
    name: Running lint on Slim/ folder...
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6
          
      - name: Install dependencies
        if: ${{ !env.ACT }}
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: libperl-critic-perl libio-socket-ssl-perl libnet-ssleay-perl netcat-traditional
          version: 1

      - name: Get changed files
        id: files
        run: |
          # Haal alleen de uiterste punt van de doel-branch op, niet de hele historie
          git fetch origin ${{ github.base_ref }} --depth=1
          
          # Vergelijk de huidige commit met de doel-branch
          # We gebruiken 'origin/${{ github.base_ref }}' omdat we die net hebben gefetched
          CHANGED=$(git diff --name-only FETCH_HEAD...HEAD | grep -E '\.(pm|pl)$' | xargs || true)
          
          echo "files=$CHANGED" >> $GITHUB_OUTPUT
          
      - name: Register problem matcher
        run: echo "::add-matcher::.github/perlcritic-matcher.json"

      - name: Run perlcritic
        run: perlcritic --severity 5 --verbose "%f:%l:%c:%m\n" ${{ steps.files.outputs.files }} || [ $? -eq 2 ]

