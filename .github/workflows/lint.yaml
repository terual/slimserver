name: 'Lint perl'
on:
  workflow_dispatch:
  pull_request:

permissions:
  checks: write
  contents: read    # Best practice: explicit add 'read' when adding other rights

jobs:
  linux:
    name: Running lint on Slim/ folder...
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        if: ${{ !env.ACT }}
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: libperl-critic-perl libio-socket-ssl-perl libnet-ssleay-perl netcat-traditional
          version: 1

      - name: Get changed files
        id: files
        run: |
          # Get the changed files
          echo "changed_files=$(git diff --name-only origin/main...HEAD | grep -E '\.(pm|pl)$' | xargs)" >> $GITHUB_OUTPUT

      - name: Register problemmMatcher
        run: echo "::add-matcher::.github/perlcritic-matcher.json"

      - name: Run perlcritic
        run: perlcritic --severity 5 --verbose "%f:%l:%c:%m\n" ${{ steps.files.outputs.changed_files }}

