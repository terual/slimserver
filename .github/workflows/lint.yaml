name: 'Perlcritic'
on:
  workflow_dispatch:
  pull_request:

permissions:
  checks: write
  contents: read    # Best practice: explicit add 'read' when adding other rights

jobs:
  linux:
    name: Running lint on Slim/ folder...
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 
          
      - name: Install dependencies
        if: ${{ !env.ACT }}
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: libperl-critic-perl libio-socket-ssl-perl libnet-ssleay-perl netcat-traditional
          version: 1

      - name: Get changed files
        id: files
        run: |
          # Bepaal de target branch (bijv. public/9.2)
          TARGET_BRANCH=${{ github.base_ref }}
          
          # Haal alleen die specifieke branch binnen
          git fetch origin $TARGET_BRANCH --depth=1

          # Gebruik de tweepunts-notatie (..) in plaats van de driepunts (...)
          # Dit vergelijkt de huidige staat direct met de target branch
          CHANGED=$(git diff --name-only origin/$TARGET_BRANCH..HEAD | grep -E '\.(pm|pl)$' | xargs || true)
          
          echo "files=$CHANGED" >> $GITHUB_OUTPUT
          
      - name: Register problem matcher
        run: echo "::add-matcher::.github/perlcritic-matcher.json"

      - name: Run perlcritic
        run: perlcritic --severity 5 --nocolor --verbose "%f:%l:%c:%m\n" ${{ steps.files.outputs.changed_files }} || [ $? -eq 2 ]

